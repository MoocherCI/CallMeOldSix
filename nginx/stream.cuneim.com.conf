# ${APP_252_HOST} is an envsubst placeholder — substitute during deployment

upstream stream_pool {
    least_conn;
    # Local (251) app instances
    server app-0:3000 max_fails=2 fail_timeout=30s;
    server app-1:3000 max_fails=2 fail_timeout=30s;
    server app-2:3000 max_fails=2 fail_timeout=30s;
    server app-3:3000 max_fails=2 fail_timeout=30s;
    server app-4:3000 max_fails=2 fail_timeout=30s;
    server app-5:3000 max_fails=2 fail_timeout=30s;
    server app-6:3000 max_fails=2 fail_timeout=30s;
    server app-7:3000 max_fails=2 fail_timeout=30s;
    # Remote (252) app instances
    server ${APP_252_HOST}:3000 max_fails=2 fail_timeout=30s;
    server ${APP_252_HOST}:3001 max_fails=2 fail_timeout=30s;
}

server {
    listen 80;
    server_name next-stream.cuneim.com stream.cuneim.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name next-stream.cuneim.com stream.cuneim.com;

    ssl_certificate     /etc/letsencrypt/live/cuneim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuneim.com/privkey.pem;

    # /v1/* request bodies may exceed the 1MiB default (chat context / session snapshots)
    client_max_body_size 50m;

    # /v1/* -> /v1/proxy rewrite (formerly Next.js middleware, now nginx)
    location /v1/ {
        proxy_set_header X-Original-Path $request_uri;
        rewrite ^/v1/(.*)$ /v1/proxy break;
        proxy_pass http://stream_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        proxy_pass http://stream_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
