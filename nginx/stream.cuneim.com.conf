upstream stream_pool {
    least_conn;
    # Local (251) app instances
    server 127.0.0.1:3000 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3002 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3003 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3004 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3005 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3006 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3007 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3008 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3009 max_fails=2 fail_timeout=30s;
    # Remote (252) app instances
    server 192.168.11.12:3000 max_fails=2 fail_timeout=30s;
    server 192.168.11.12:3001 max_fails=2 fail_timeout=30s;
    server 192.168.11.12:3002 max_fails=2 fail_timeout=30s;
    server 192.168.11.12:3003 max_fails=2 fail_timeout=30s;
    server 192.168.11.12:3004 max_fails=2 fail_timeout=30s;
    server 192.168.11.12:3005 max_fails=2 fail_timeout=30s;
}

server {
    listen 80;
    server_name stream.cuneim.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stream.cuneim.com;

    ssl_certificate     /etc/letsencrypt/live/stream.cuneim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.cuneim.com/privkey.pem;

    location / {
        proxy_pass http://stream_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
