# ${APP_252_HOST} is an envsubst placeholder — substitute during deployment

upstream admin_backend {
    server ${APP_252_HOST}:3006;
}

server {
    listen 80;
    server_name admin.cuneim.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.cuneim.com;

    ssl_certificate     /etc/letsencrypt/live/cuneim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuneim.com/privkey.pem;

    location / {
        proxy_pass http://admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
