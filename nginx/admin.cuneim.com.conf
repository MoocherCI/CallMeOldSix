server {
    listen 80;
    server_name admin.cuneim.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.cuneim.com;

    ssl_certificate     /etc/letsencrypt/live/admin.cuneim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.cuneim.com/privkey.pem;

    location / {
        proxy_pass http://192.168.11.12:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
