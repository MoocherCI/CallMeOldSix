# d.cuneim.com — 公开二进制下载
# 原指向 AWS CloudFront (源站 S3)；迁移后由 251 的 nginx 直接静态服务。
# 复用现有通配证书 *.cuneim.com，URL 保持与 CloudFront→S3 根路径一致：
#   https://d.cuneim.com/<file>
# 文件放在宿主 ~/cuneim/downloads/，经 docker-compose.251.yml 挂载到容器
# /usr/share/nginx/html（只读）。

server {
    listen 80;
    server_name d.cuneim.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name d.cuneim.com;

    ssl_certificate     /etc/letsencrypt/live/cuneim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuneim.com/privkey.pem;

    # 保持与 S3 上一致的 content-type（官方 nginx mime.types 没有 dmg 映射，
    # 缺省会 fallback 成 application/octet-stream）
    types {
        application/x-apple-diskimage dmg;
    }
    default_type application/octet-stream;

    root /usr/share/nginx/html;

    location / {
        # 默认不列目录；命中文件即返回，未命中 404
        autoindex off;
        add_header Content-Disposition 'attachment';
        # 大文件限速，防止下载流量打满 251 出口带宽（按需调整）
        limit_rate 5m;

        # releases/ 按版本分目录、文件不可变（如 3.3.0-preview.7），可长缓存；
        # CF 橙云代理会按此头缓存静态资源，减源站压力
        location ~* ^/releases/.+\.(dmg|zip|pkg|exe|tar\.gz|tgz)$ {
            add_header Content-Disposition 'attachment';
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
