services:
  nginx:
    image: nginx:${NGINX_IMAGE_TAG:-alpine}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-512m}
    cpus: ${NGINX_CPU_LIMIT:-0.50}
    networks:
      - app_network

  agent:
    image: ghcr.io/moocherci/agent:${AGENT_IMAGE_TAG:-latest}
    ports:
      - "3100:3000"
    volumes:
      - shared-logs:/app/logs
      - agent_data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: ${AGENT_MEM_LIMIT:-4g}
    cpus: ${AGENT_CPU_LIMIT:-2.00}
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  app-0:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-2g}
    cpus: ${APP_CPU_LIMIT:-1.50}
    healthcheck:
      # next-server binds to the container IP ($HOSTNAME), not localhost
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$HOSTNAME:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app_network

  app-1:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
