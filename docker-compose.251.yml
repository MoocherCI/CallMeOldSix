services:
  nginx:
    image: nginx:${NGINX_IMAGE_TAG:-alpine}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - app_network

  agent:
    image: ghcr.io/moocherci/agent:${AGENT_IMAGE_TAG:-latest}
    ports:
      - "3100:3100"
    volumes:
      - shared-logs:/app/logs
      - agent_data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  app-0:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  app-1:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3001:3000"
