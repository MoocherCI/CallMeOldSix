name: 'Deploy User Platform'

on:
  push:
    tags:
      - 'dev-v**'
      - 'test-v**'
      - 'next-v**'
      - 'prod-v**'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        type: choice
        options:
          - dev
          - test
          - next
          - prod
      version:
        description: '版本号（留空=自动生成时间戳，如 20260312153000）'
        required: false
        type: string
        default: ''
      services:
        description: '部署服务（all=全部）'
        required: false
        type: choice
        options:
          - all
          - app
          - agent
          - admin
          - app+agent
          - app+admin
          - agent+admin
        default: 'all'
      branch:
        description: '私有仓库分支（留空=默认分支）'
        required: false
        type: string
        default: ''
      target:
        description: '部署目标（单机/双机）'
        required: false
        type: choice
        options:
          - single
          - dual
        default: 'single'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: moocherci/user-platform
  AGENT_IMAGE_NAME: moocherci/agent
  ADMIN_IMAGE_NAME: moocherci/admin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      services_display: ${{ env.SERVICES_DISPLAY }}
      deploy_status: ${{ job.status }}
      repo_branch: ${{ env.REPO_BRANCH }}
      commit_sha: ${{ env.COMMIT_SHA }}
      commit_message: ${{ env.COMMIT_MESSAGE }}
      commit_time: ${{ env.COMMIT_TIME }}
      deploy_tag: ${{ env.DEPLOY_TAG }}
      deploy_target: ${{ env.DEPLOY_TARGET }}
    permissions:
      contents: read
      packages: write
    steps:
      # Step 1: Checkout proxy repo (for scripts) and configure SSH
      - name: Checkout proxy repo
        uses: actions/checkout@v4

      - name: Backup proxy repo deploy files
        run: |
          mkdir -p /tmp/proxy-deploy/
          cp docker-compose.251.yml docker-compose.252.yml /tmp/proxy-deploy/
          cp -r nginx /tmp/proxy-deploy/

      - name: Configure git for private repo access
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/gitconfig.sh
        env:
          ED25519_KEY: ${{ secrets.ED25519_KEY }}

      # Step 2: Parse tag for environment, branch, and services
      - name: Parse tag for environment, branch, and services
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # --- Manual trigger: read from inputs ---
            DEPLOY_ENV="${{ inputs.environment }}"
            VERSION="${{ inputs.version }}"
            REPO_BRANCH="${{ inputs.branch }}"
            SERVICES_INPUT="${{ inputs.services }}"

            # Auto-generate version if empty (handle empty string from API dispatch)
            VERSION=$(echo "$VERSION" | xargs)
            if [ -z "$VERSION" ]; then
              VERSION=$(date -u +'%Y%m%d%H%M%S')
            fi

            # Set DEPLOY_HOST based on environment
            echo "DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}" >> $GITHUB_ENV

            # Parse services
            BUILD_APP="false"
            BUILD_AGENT="false"
            BUILD_ADMIN="false"
            DISPLAY_PARTS=()

            if [ "$SERVICES_INPUT" = "all" ] || [ -z "$SERVICES_INPUT" ]; then
              BUILD_APP="true"
              BUILD_AGENT="true"
              BUILD_ADMIN="true"
              SERVICES_DISPLAY="app, agent, admin"
            else
              IFS='+' read -ra SVC_ARRAY <<< "$SERVICES_INPUT"
              for svc in "${SVC_ARRAY[@]}"; do
                case "$svc" in
                  app)   BUILD_APP="true";   DISPLAY_PARTS+=("app") ;;
                  agent) BUILD_AGENT="true"; DISPLAY_PARTS+=("agent") ;;
                  admin) BUILD_ADMIN="true"; DISPLAY_PARTS+=("admin") ;;
                esac
              done
              SERVICES_DISPLAY=$(IFS=', '; echo "${DISPLAY_PARTS[*]}")
            fi

            # Construct a synthetic tag name for display
            DEPLOY_TAG="${DEPLOY_ENV}-v${VERSION}"
            IMAGE_TAG="${DEPLOY_ENV}-v${VERSION}"

            # Parse deploy target from inputs
            DEPLOY_TARGET="${{ inputs.target }}"
            [ -z "$DEPLOY_TARGET" ] && DEPLOY_TARGET="single"
          else
            # --- Tag trigger: parse from github.ref_name (existing logic) ---
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" == dev-v* ]]; then
              DEPLOY_ENV="dev"
              REMAINDER="${TAG#dev-v}"
            elif [[ "$TAG" == test-v* ]]; then
              DEPLOY_ENV="test"
              REMAINDER="${TAG#test-v}"
            elif [[ "$TAG" == next-v* ]]; then
              DEPLOY_ENV="next"
              REMAINDER="${TAG#next-v}"
            elif [[ "$TAG" == prod-v* ]]; then
              DEPLOY_ENV="prod"
              REMAINDER="${TAG#prod-v}"
            fi

            echo "DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}" >> $GITHUB_ENV

            BUILD_APP="false"
            BUILD_AGENT="false"
            BUILD_ADMIN="false"
            REPO_BRANCH=""

            if [[ "$REMAINDER" == *+* ]]; then
              VERSION_PART="${REMAINDER%%+*}"
              SERVICES_AND_BRANCH="${REMAINDER#*+}"

              if [[ "$SERVICES_AND_BRANCH" == *-* ]]; then
                SERVICES_PART="${SERVICES_AND_BRANCH%%-*}"
                REPO_BRANCH="${SERVICES_AND_BRANCH#*-}"
              else
                SERVICES_PART="$SERVICES_AND_BRANCH"
              fi

              IFS='.' read -ra SVC_ARRAY <<< "$SERVICES_PART"
              DISPLAY_PARTS=()
              for svc in "${SVC_ARRAY[@]}"; do
                case "$svc" in
                  app)   BUILD_APP="true";   DISPLAY_PARTS+=("app") ;;
                  agent) BUILD_AGENT="true"; DISPLAY_PARTS+=("agent") ;;
                  admin) BUILD_ADMIN="true"; DISPLAY_PARTS+=("admin") ;;
                esac
              done
              SERVICES_DISPLAY=$(IFS=', '; echo "${DISPLAY_PARTS[*]}")
            else
              BUILD_APP="true"
              BUILD_AGENT="true"
              BUILD_ADMIN="true"
              SERVICES_DISPLAY="app, agent, admin"

              if [[ "$REMAINDER" == *-* ]]; then
                REPO_BRANCH="${REMAINDER#*-}"
              fi
            fi

            DEPLOY_TAG="$TAG"
            # IMAGE_TAG: strip +services portion from tag for Docker compatibility
            IMAGE_TAG=$(echo "$TAG" | sed 's/+[^-]*//' | sed 's/[^a-zA-Z0-9._-]/-/g')

            DEPLOY_TARGET="single"
          fi

          echo "DEPLOY_ENV=${DEPLOY_ENV}" >> $GITHUB_ENV
          echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
          echo "BUILD_APP=${BUILD_APP}" >> $GITHUB_ENV
          echo "BUILD_AGENT=${BUILD_AGENT}" >> $GITHUB_ENV
          echo "BUILD_ADMIN=${BUILD_ADMIN}" >> $GITHUB_ENV
          echo "SERVICES_DISPLAY=${SERVICES_DISPLAY}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "DEPLOY_TAG=${DEPLOY_TAG}" >> $GITHUB_ENV
          [ "$DEPLOY_ENV" = "next" ] && DEPLOY_TARGET="dual"
          echo "DEPLOY_TARGET=${DEPLOY_TARGET}" >> $GITHUB_ENV

      # Step 3: Checkout private repository
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REPOSITORY }}
          ssh-key: ${{ secrets.ED25519_KEY }}
          ref: ${{ env.REPO_BRANCH }}

      - name: Restore proxy repo deploy files
        run: |
          cp /tmp/proxy-deploy/docker-compose.251.yml /tmp/proxy-deploy/docker-compose.252.yml .
          cp -r /tmp/proxy-deploy/nginx .

      - name: Extract commit info from private repo
        run: |
          echo "COMMIT_SHA=$(git log -1 --pretty=format:'%H')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV
          echo "COMMIT_TIME=$(git log -1 --pretty=format:'%cI')" >> $GITHUB_ENV

      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      # Step 5.5: Generate Prisma schemas from shared models
      - name: Generate Prisma schemas
        if: env.BUILD_APP == 'true' || env.BUILD_ADMIN == 'true'
        run: |
          chmod +x prisma-shared/build-schema.sh
          if [ "${{ env.BUILD_APP }}" = "true" ]; then
            bash prisma-shared/build-schema.sh user-platform/prisma/base.prisma user-platform/prisma/schema.prisma
          fi
          if [ "${{ env.BUILD_ADMIN }}" = "true" ]; then
            bash prisma-shared/build-schema.sh admin-platform/api/prisma/base.prisma admin-platform/api/prisma/schema.prisma
          fi

      - name: Verify Docker build context inputs
        if: env.BUILD_APP == 'true' || env.BUILD_ADMIN == 'true'
        run: |
          test -d packages/shared
          test -d prisma-shared
          if [ "${{ env.BUILD_APP }}" = "true" ]; then
            test -f user-platform/package.json
            test -f user-platform/Dockerfile
            test -f user-platform/prisma/schema.prisma
          fi
          if [ "${{ env.BUILD_ADMIN }}" = "true" ]; then
            test -f admin-platform/api/package.json
            test -f admin-platform/api/Dockerfile
            test -f admin-platform/api/prisma/schema.prisma
          fi          

      # Step 6: Build and push Docker image
      - name: Build and push Docker image
        if: env.BUILD_APP == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}
          file: ./user-platform/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 6.5: Build and push Agent Docker image
      - name: Build and push Agent Docker image
        if: env.BUILD_AGENT == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 6.6: Build and push Admin Docker image
      - name: Build and push Admin Docker image
        if: env.BUILD_ADMIN == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}
          file: ./admin-platform/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 7: Upload files to server
      - name: Copy global files to server
        if: env.DEPLOY_TARGET != 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "user-platform/docker-compose.yml"
          target: "~/cuneim/"
          strip_components: 1

      - name: Copy app prisma files to server
        if: env.BUILD_APP == 'true' && env.DEPLOY_TARGET != 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "user-platform/prisma/"
          target: "~/cuneim/"
          strip_components: 1

      - name: Copy admin prisma files to server
        if: env.BUILD_ADMIN == 'true' && env.DEPLOY_TARGET != 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "admin-platform/api/prisma/"
          target: "~/cuneim/"
          strip_components: 1

      - name: Copy nginx files to server
        if: env.BUILD_ADMIN == 'true' && env.DEPLOY_TARGET != 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "user-platform/nginx/"
          target: "~/cuneim/"
          strip_components: 1

      # Step 7.5: Generate .env content on runner (whitelist — only listed app secrets are written)
      - name: Generate .env content
        id: gen_env
        run: |
          ENV_CONTENT=$(echo '${{ toJSON(secrets) }}' | jq -r '
            ["POSTGRES_PASSWORD","JWT_SECRET","JWT_REFRESH_SECRET","SESSION_SECRET","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","GOOGLE_REDIRECT_URL","STRIPE_SECRET_KEY","NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY","STRIPE_WEBHOOK_SECRET","BASE_URL","ADMIN_SECRET","NEXT_PUBLIC_APP_URL","RESEND_API_KEY","EMAIL_FROM","OPENROUTER_API_KEY","TAVILY_API_KEY","CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_API_TOKEN","ADMIN_JWT_SECRET","ADMIN_JWT_REFRESH_SECRET","TOTP_ENCRYPTION_KEY","INTERNAL_BASE_URL","SWAGGER_PASSWORD","STREAM_JWT_SECRET","STREAM_BASE_URL"] as $include |
            to_entries[] | select(.key as $k | $include | index($k)) |
            "\(.key)=\(.value)"
          ')
          echo "ENV_CONTENT<<EOF" >> $GITHUB_OUTPUT
          echo "$ENV_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Step 8: Deploy to server via SSH
      - name: Deploy to server
        if: env.DEPLOY_TARGET != 'dual'
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: ${{ steps.gen_env.outputs.ENV_CONTENT }}
          GHCR_IMAGE: ${{ env.IMAGE_NAME }}
          GHCR_IMAGE_AGENT: ${{ env.AGENT_IMAGE_NAME }}
          GHCR_IMAGE_ADMIN: ${{ env.ADMIN_IMAGE_NAME }}
          DEPLOY_ENV_VAL: ${{ env.DEPLOY_ENV }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_CONTENT,GHCR_IMAGE,GHCR_IMAGE_AGENT,GHCR_IMAGE_ADMIN,DEPLOY_ENV_VAL
          script: |
            set -e

            # Create deployment directory
            mkdir -p ~/cuneim
            mkdir -p ~/cuneim/agent/data ~/cuneim/shared-logs

            # Read old per-service image tags from existing .env (fallback to 'latest')
            OLD_APP_TAG=$(grep '^APP_IMAGE_TAG=' ~/cuneim/.env 2>/dev/null | cut -d= -f2 || echo "latest")
            OLD_AGENT_TAG=$(grep '^AGENT_IMAGE_TAG=' ~/cuneim/.env 2>/dev/null | cut -d= -f2 || echo "latest")
            OLD_ADMIN_TAG=$(grep '^ADMIN_IMAGE_TAG=' ~/cuneim/.env 2>/dev/null | cut -d= -f2 || echo "latest")
            [ -z "$OLD_APP_TAG" ] && OLD_APP_TAG="latest"
            [ -z "$OLD_AGENT_TAG" ] && OLD_AGENT_TAG="latest"
            [ -z "$OLD_ADMIN_TAG" ] && OLD_ADMIN_TAG="latest"

            # Write .env from pre-generated content
            echo "$ENV_CONTENT" > ~/cuneim/.env

            # Append non-secret env vars
            echo "GHCR_IMAGE=$GHCR_IMAGE" >> ~/cuneim/.env
            echo "GHCR_IMAGE_AGENT=$GHCR_IMAGE_AGENT" >> ~/cuneim/.env
            echo "GHCR_IMAGE_ADMIN=$GHCR_IMAGE_ADMIN" >> ~/cuneim/.env
            echo "DEPLOY_ENV=$DEPLOY_ENV_VAL" >> ~/cuneim/.env

            # Append per-service image tags (new tag for built services, old tag for unbuilt)
            if [ "${{ env.BUILD_APP }}" = "true" ]; then echo "APP_IMAGE_TAG=${{ env.IMAGE_TAG }}" >> ~/cuneim/.env; else echo "APP_IMAGE_TAG=$OLD_APP_TAG" >> ~/cuneim/.env; fi
            if [ "${{ env.BUILD_AGENT }}" = "true" ]; then echo "AGENT_IMAGE_TAG=${{ env.IMAGE_TAG }}" >> ~/cuneim/.env; else echo "AGENT_IMAGE_TAG=$OLD_AGENT_TAG" >> ~/cuneim/.env; fi
            if [ "${{ env.BUILD_ADMIN }}" = "true" ]; then echo "ADMIN_IMAGE_TAG=${{ env.IMAGE_TAG }}" >> ~/cuneim/.env; else echo "ADMIN_IMAGE_TAG=$OLD_ADMIN_TAG" >> ~/cuneim/.env; fi

            cd ~/cuneim

            # Login to GHCR to pull private images
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            # Pull images for selected services
            PULL_SERVICES=""
            if [ "${{ env.BUILD_APP }}" = "true" ]; then PULL_SERVICES="$PULL_SERVICES app"; fi
            if [ "${{ env.BUILD_AGENT }}" = "true" ]; then PULL_SERVICES="$PULL_SERVICES agent"; fi
            if [ "${{ env.BUILD_ADMIN }}" = "true" ]; then PULL_SERVICES="$PULL_SERVICES admin"; fi
            if [ -n "$PULL_SERVICES" ]; then
              docker compose pull $PULL_SERVICES
            fi

            # Start/restart selected services only
            UP_SERVICES=""
            if [ "${{ env.BUILD_APP }}" = "true" ]; then UP_SERVICES="$UP_SERVICES app"; fi
            if [ "${{ env.BUILD_AGENT }}" = "true" ]; then UP_SERVICES="$UP_SERVICES agent"; fi
            if [ "${{ env.BUILD_ADMIN }}" = "true" ]; then UP_SERVICES="$UP_SERVICES admin"; fi
            if [ -n "$UP_SERVICES" ]; then
              docker compose up -d $UP_SERVICES
            fi

            # Run database migrations (conditional)
            if [ "${{ env.BUILD_APP }}" = "true" ]; then
              docker compose exec -T --user root app npx prisma migrate deploy || true
            fi

            # Run admin database migrations and seed (conditional)
            if [ "${{ env.BUILD_ADMIN }}" = "true" ]; then
              docker compose exec -T admin npx prisma migrate deploy || true
              if [ ! -f ~/cuneim/.seed_done ]; then
                docker compose exec -T admin node prisma/seed.js && touch ~/cuneim/.seed_done
              fi
            fi

            # Deploy admin nginx config (conditional)
            if [ "${{ env.BUILD_ADMIN }}" = "true" ]; then
              sudo cp ~/cuneim/nginx/admin.cuneim.com.conf /etc/nginx/conf.d/admin.cuneim.com.conf
              sudo nginx -t && sudo systemctl reload nginx
            fi

      # ============================================================
      # Dual-machine deploy path (target=dual)
      # ============================================================

      # Dual Step 0: Generate .env.251 and .env.252
      - name: Generate dual .env files
        if: env.DEPLOY_TARGET == 'dual'
        id: gen_dual_env
        run: |
          # Generate common secret env content using same whitelist as single path
          ENV_CONTENT=$(echo '${{ toJSON(secrets) }}' | jq -r '
            ["POSTGRES_PASSWORD","JWT_SECRET","JWT_REFRESH_SECRET","SESSION_SECRET","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","GOOGLE_REDIRECT_URL","STRIPE_SECRET_KEY","NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY","STRIPE_WEBHOOK_SECRET","BASE_URL","ADMIN_SECRET","NEXT_PUBLIC_APP_URL","RESEND_API_KEY","EMAIL_FROM","OPENROUTER_API_KEY","TAVILY_API_KEY","CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_API_TOKEN","ADMIN_JWT_SECRET","ADMIN_JWT_REFRESH_SECRET","TOTP_ENCRYPTION_KEY","INTERNAL_BASE_URL","SWAGGER_PASSWORD","STREAM_JWT_SECRET","STREAM_BASE_URL"] as $include |
            to_entries[] | select(.key as $k | $include | index($k)) |
            "\(.key)=\(.value)"
          ')

          # Non-secret env vars shared by both machines
          NON_SECRET="GHCR_IMAGE=${{ env.IMAGE_NAME }}
          GHCR_IMAGE_AGENT=${{ env.AGENT_IMAGE_NAME }}
          GHCR_IMAGE_ADMIN=${{ env.ADMIN_IMAGE_NAME }}
          DEPLOY_ENV=${{ env.DEPLOY_ENV }}
          APP_IMAGE_TAG=${{ env.IMAGE_TAG }}
          AGENT_IMAGE_TAG=${{ env.IMAGE_TAG }}
          ADMIN_IMAGE_TAG=${{ env.IMAGE_TAG }}"

          # .env.251 — app server: DB/Redis on 252, agent pool local
          {
            echo "$ENV_CONTENT"
            echo "$NON_SECRET"
            echo "DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.DEPLOY_HOST_252 }}:5432/cuneim"
            echo "REDIS_URL=redis://${{ secrets.DEPLOY_HOST_252 }}:6379"
            echo "AGENT_POOL_URL=http://localhost:3100"
          } > .env.251

          # .env.252 — data server: DB/Redis local, agent pool on 251
          {
            echo "$ENV_CONTENT"
            echo "$NON_SECRET"
            echo "DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/cuneim"
            echo "REDIS_URL=redis://redis:6379"
            echo "AGENT_POOL_URL=http://${{ secrets.DEPLOY_HOST_251 }}:3100"
          } > .env.252

      # Dual Step 1: SCP to 252 (data server)
      - name: Copy compose file to 252
        if: env.DEPLOY_TARGET == 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_252 }}
          username: ${{ secrets.DEPLOY_USER_252 }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.252.yml"
          target: "~/cuneim/"

      - name: Copy app prisma files to 252
        if: env.BUILD_APP == 'true' && env.DEPLOY_TARGET == 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_252 }}
          username: ${{ secrets.DEPLOY_USER_252 }}
          key: ${{ secrets.SSH_KEY }}
          source: "user-platform/prisma/"
          target: "~/cuneim/"
          strip_components: 1

      - name: Copy admin prisma files to 252
        if: env.BUILD_ADMIN == 'true' && env.DEPLOY_TARGET == 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_252 }}
          username: ${{ secrets.DEPLOY_USER_252 }}
          key: ${{ secrets.SSH_KEY }}
          source: "admin-platform/api/prisma/"
          target: "~/cuneim/"
          strip_components: 1

      - name: Copy .env.252 to 252
        if: env.DEPLOY_TARGET == 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_252 }}
          username: ${{ secrets.DEPLOY_USER_252 }}
          key: ${{ secrets.SSH_KEY }}
          source: ".env.252"
          target: "~/cuneim/"

      # Dual Step 2: SSH deploy to 252 (data server — postgres, redis, admin, app)
      - name: Deploy to 252 (data server)
        if: env.DEPLOY_TARGET == 'dual'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_IMAGE: ${{ env.IMAGE_NAME }}
          GHCR_IMAGE_AGENT: ${{ env.AGENT_IMAGE_NAME }}
          GHCR_IMAGE_ADMIN: ${{ env.ADMIN_IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.DEPLOY_HOST_252 }}
          username: ${{ secrets.DEPLOY_USER_252 }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_PAT,GHCR_USERNAME,GHCR_IMAGE,GHCR_IMAGE_AGENT,GHCR_IMAGE_ADMIN,IMAGE_TAG
          script: |
            set -e

            # Create deployment directories
            mkdir -p ~/cuneim
            mkdir -p ~/cuneim/agent/data ~/cuneim/shared-logs

            # Activate machine-specific files
            cp ~/cuneim/docker-compose.252.yml ~/cuneim/docker-compose.yml
            mv ~/cuneim/.env.252 ~/cuneim/.env

            cd ~/cuneim

            # Login to GHCR to pull private images
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            # Pull images
            docker compose pull

            # Start data layer first
            docker compose up -d postgres redis

            # Wait for postgres to be healthy
            echo "Waiting for postgres to be healthy..."
            for i in $(seq 1 30); do
              if docker compose exec -T postgres pg_isready -U postgres 2>/dev/null; then
                echo "Postgres is ready"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            # Start app layer (admin + app)
            docker compose up -d admin app-0 app-1 app-2 app-3 app-4 app-5

            # Run database migrations
            docker compose exec -T --user root app-0 npx prisma migrate deploy || true
            docker compose exec -T admin npx prisma migrate deploy || true

            # Admin seed (first deploy only)
            if [ ! -f ~/cuneim/.seed_done ]; then
              docker compose exec -T admin node prisma/seed.js && touch ~/cuneim/.seed_done
            fi

      # Dual Step 3: SCP to 251 (app server)
      - name: Copy compose file to 251
        if: env.DEPLOY_TARGET == 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_251 }}
          username: ${{ secrets.DEPLOY_USER_251 }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.251.yml"
          target: "~/cuneim/"

      - name: Copy nginx files to 251
        if: env.DEPLOY_TARGET == 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_251 }}
          username: ${{ secrets.DEPLOY_USER_251 }}
          key: ${{ secrets.SSH_KEY }}
          source: "nginx/"
          target: "~/cuneim/"

      - name: Copy .env.251 to 251
        if: env.DEPLOY_TARGET == 'dual'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_251 }}
          username: ${{ secrets.DEPLOY_USER_251 }}
          key: ${{ secrets.SSH_KEY }}
          source: ".env.251"
          target: "~/cuneim/"

      # Dual Step 4: SSH deploy to 251 (app server — agent, app, nginx)
      - name: Deploy to 251 (app server)
        if: env.DEPLOY_TARGET == 'dual'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_IMAGE: ${{ env.IMAGE_NAME }}
          GHCR_IMAGE_AGENT: ${{ env.AGENT_IMAGE_NAME }}
          GHCR_IMAGE_ADMIN: ${{ env.ADMIN_IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.DEPLOY_HOST_251 }}
          username: ${{ secrets.DEPLOY_USER_251 }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_PAT,GHCR_USERNAME,GHCR_IMAGE,GHCR_IMAGE_AGENT,GHCR_IMAGE_ADMIN,IMAGE_TAG
          script: |
            set -e

            # Create deployment directories
            mkdir -p ~/cuneim
            mkdir -p ~/cuneim/agent/data ~/cuneim/shared-logs

            # Activate machine-specific files
            cp ~/cuneim/docker-compose.251.yml ~/cuneim/docker-compose.yml
            mv ~/cuneim/.env.251 ~/cuneim/.env

            cd ~/cuneim

            # Login to GHCR to pull private images
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            # Pull images
            docker compose pull

            # Start app layer (agent + app)
            docker compose up -d agent app-0 app-1 app-2 app-3 app-4 app-5 app-6 app-7 app-8 app-9

            # Run database migrations
            docker compose exec -T --user root app-0 npx prisma migrate deploy || true

            # Deploy nginx config
            sudo cp ~/cuneim/nginx/*.conf /etc/nginx/conf.d/
            sudo nginx -t && sudo systemctl reload nginx

  notify:
    if: always()
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout proxy repo
        uses: actions/checkout@v4

      - name: 🔔 推送到 Lark
        env:
          STATUS: ${{ needs.build-and-deploy.result }}
          SERVICES: ${{ needs.build-and-deploy.outputs.services_display }}
          ACTOR: ${{ github.actor }}
          DEPLOY_TAG: ${{ needs.build-and-deploy.outputs.deploy_tag }}
          DEPLOY_TARGET: ${{ needs.build-and-deploy.outputs.deploy_target }}
          COMMIT_SHA: ${{ needs.build-and-deploy.outputs.commit_sha }}
          COMMIT_MESSAGE: ${{ needs.build-and-deploy.outputs.commit_message }}
          COMMIT_TIME: ${{ needs.build-and-deploy.outputs.commit_time }}
          REPOSITORY: ${{ secrets.REPOSITORY }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/notify-worker.sh
