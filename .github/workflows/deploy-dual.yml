name: 'Deploy Dual Machine'


permissions:
  contents: read
  packages: write
on:
  push:
    tags:
      - 'next-v**'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        type: choice
        options:
          - next
      version:
        description: '版本号（留空=自动生成时间戳，如 20260312153000）'
        required: false
        type: string
        default: ''
      services:
        description: '部署服务（all=全部）'
        required: false
        type: choice
        options:
          - all
          - app
          - agent
          - admin
          - app+agent
          - app+admin
          - agent+admin
        default: 'all'
      branch:
        description: '私有仓库分支（留空=默认分支）'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: moocherci/user-platform
  AGENT_IMAGE_NAME: moocherci/agent
  ADMIN_IMAGE_NAME: moocherci/admin

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      build_app: ${{ steps.parse_tag.outputs.build_app }}
      build_agent: ${{ steps.parse_tag.outputs.build_agent }}
      build_admin: ${{ steps.parse_tag.outputs.build_admin }}
      image_tag: ${{ steps.parse_tag.outputs.image_tag }}
      registry: ${{ env.REGISTRY }}
      image_name: ${{ env.IMAGE_NAME }}
      agent_image_name: ${{ env.AGENT_IMAGE_NAME }}
      admin_image_name: ${{ env.ADMIN_IMAGE_NAME }}
      repo_branch: ${{ steps.parse_tag.outputs.repo_branch }}
      deploy_env: ${{ steps.parse_tag.outputs.deploy_env }}
      deploy_target: ${{ steps.parse_tag.outputs.deploy_target }}
      services_display: ${{ steps.parse_tag.outputs.services_display }}
      deploy_tag: ${{ steps.parse_tag.outputs.deploy_tag }}
    steps:
      - name: Checkout proxy repo
        uses: actions/checkout@v4

      - name: Parse deployment tag
        id: parse_tag
        env:
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_SERVICES: ${{ github.event.inputs.services }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          eval "$(bash .github/scripts/parse-tag.sh)"
          echo "build_app=${BUILD_APP}" >> $GITHUB_OUTPUT
          echo "build_agent=${BUILD_AGENT}" >> $GITHUB_OUTPUT
          echo "build_admin=${BUILD_ADMIN}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "repo_branch=${REPO_BRANCH}" >> $GITHUB_OUTPUT
          echo "deploy_env=${DEPLOY_ENV}" >> $GITHUB_OUTPUT
          echo "deploy_target=${DEPLOY_TARGET}" >> $GITHUB_OUTPUT
          echo "services_display=${SERVICES_DISPLAY}" >> $GITHUB_OUTPUT
          echo "deploy_tag=${DEPLOY_TAG}" >> $GITHUB_OUTPUT

  build:
    needs: parse
    uses: ./.github/workflows/build-images.yml
    with:
      build_app: ${{ needs.parse.outputs.build_app }}
      build_agent: ${{ needs.parse.outputs.build_agent }}
      build_admin: ${{ needs.parse.outputs.build_admin }}
      image_tag: ${{ needs.parse.outputs.image_tag }}
      registry: ${{ needs.parse.outputs.registry }}
      image_name: ${{ needs.parse.outputs.image_name }}
      agent_image_name: ${{ needs.parse.outputs.agent_image_name }}
      admin_image_name: ${{ needs.parse.outputs.admin_image_name }}
      repo_branch: ${{ needs.parse.outputs.repo_branch }}
    secrets: inherit

  deploy:
    needs: [parse, build]
    runs-on: ubuntu-latest
    env:
      BUILD_APP: ${{ needs.parse.outputs.build_app }}
      BUILD_AGENT: ${{ needs.parse.outputs.build_agent }}
      BUILD_ADMIN: ${{ needs.parse.outputs.build_admin }}
      IMAGE_TAG: ${{ needs.parse.outputs.image_tag }}
      IMAGE_NAME: ${{ needs.parse.outputs.image_name }}
      AGENT_IMAGE_NAME: ${{ needs.parse.outputs.agent_image_name }}
      ADMIN_IMAGE_NAME: ${{ needs.parse.outputs.admin_image_name }}
      DEPLOY_ENV: ${{ needs.parse.outputs.deploy_env }}
    steps:
      # ============================================================
      # Dual-machine deploy path
      # ============================================================

      # Checkout proxy repo (for scripts, compose files, nginx configs)
      - name: Checkout proxy repo
        uses: actions/checkout@v4

      - name: Backup proxy repo deploy files
        run: |
          mkdir -p /tmp/proxy-deploy/
          cp docker-compose.251.yml docker-compose.252.yml /tmp/proxy-deploy/
          cp -r nginx /tmp/proxy-deploy/

      - name: Configure git for private repo access
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/gitconfig.sh
        env:
          ED25519_KEY: ${{ secrets.ED25519_KEY }}

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REPOSITORY }}
          ssh-key: ${{ secrets.ED25519_KEY }}
          ref: ${{ needs.parse.outputs.repo_branch }}

      - name: Restore proxy repo deploy files
        run: |
          cp /tmp/proxy-deploy/docker-compose.251.yml /tmp/proxy-deploy/docker-compose.252.yml .
          cp -r /tmp/proxy-deploy/nginx .

      # Dual Step 0: Generate .env.251 and .env.252
      - name: Generate dual .env files
        id: gen_dual_env
        run: |
          # Generate common secret env content using same whitelist as single path
          ENV_CONTENT=$(echo '${{ toJSON(secrets) }}' | jq -r '
            ["POSTGRES_PASSWORD","JWT_SECRET","JWT_REFRESH_SECRET","SESSION_SECRET","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","GOOGLE_REDIRECT_URL","STRIPE_SECRET_KEY","NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY","STRIPE_WEBHOOK_SECRET","BASE_URL","ADMIN_SECRET","NEXT_PUBLIC_APP_URL","RESEND_API_KEY","EMAIL_FROM","OPENROUTER_API_KEY","TAVILY_API_KEY","CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_API_TOKEN","ADMIN_JWT_SECRET","ADMIN_JWT_REFRESH_SECRET","TOTP_ENCRYPTION_KEY","INTERNAL_BASE_URL","SWAGGER_PASSWORD","STREAM_JWT_SECRET","STREAM_BASE_URL"] as $include |
            to_entries[] | select(.key as $k | $include | index($k)) |
            "\(.key)=\(.value)"
          ')

          # Non-secret env vars shared by both machines
          NON_SECRET="GHCR_IMAGE=${{ env.IMAGE_NAME }}
          GHCR_IMAGE_AGENT=${{ env.AGENT_IMAGE_NAME }}
          GHCR_IMAGE_ADMIN=${{ env.ADMIN_IMAGE_NAME }}
          DEPLOY_ENV=${{ env.DEPLOY_ENV }}
          HOST=0.0.0.0
          PORT=3000
          LLM_PROVIDER=${{ vars.DUAL_LLM_PROVIDER || 'openrouter' }}
          AGENT_CONFIG_PATH=/app/config/agent.json.enc
          PRICING_CONFIG_PATH=/app/config/pricing.json
          LOG_DIR=/app/logs
          LOG_MAX_SIZE=${{ vars.DUAL_AGENT_LOG_MAX_SIZE || '2GB' }}
          LOG_MAX_FILES=${{ vars.DUAL_AGENT_LOG_MAX_FILES || '10' }}
          RUN_ADMIN_MIGRATIONS=${{ vars.DUAL_RUN_ADMIN_MIGRATIONS || 'false' }}
          APP_MEM_LIMIT=${{ vars.DUAL_APP_MEM_LIMIT || '2g' }}
          APP_CPU_LIMIT=${{ vars.DUAL_APP_CPU_LIMIT || '1.50' }}
          AGENT_MEM_LIMIT=${{ vars.DUAL_AGENT_MEM_LIMIT || '4g' }}
          AGENT_CPU_LIMIT=${{ vars.DUAL_AGENT_CPU_LIMIT || '2.00' }}
          NGINX_MEM_LIMIT=${{ vars.DUAL_NGINX_MEM_LIMIT || '512m' }}
          NGINX_CPU_LIMIT=${{ vars.DUAL_NGINX_CPU_LIMIT || '0.50' }}
          POSTGRES_MEM_LIMIT=${{ vars.DUAL_POSTGRES_MEM_LIMIT || '40g' }}
          POSTGRES_CPU_LIMIT=${{ vars.DUAL_POSTGRES_CPU_LIMIT || '8.00' }}
          POSTGRES_SHARED_BUFFERS=${{ vars.DUAL_POSTGRES_SHARED_BUFFERS || '10GB' }}
          POSTGRES_EFFECTIVE_CACHE_SIZE=${{ vars.DUAL_POSTGRES_EFFECTIVE_CACHE_SIZE || '30GB' }}
          POSTGRES_MAINTENANCE_WORK_MEM=${{ vars.DUAL_POSTGRES_MAINTENANCE_WORK_MEM || '2GB' }}
          REDIS_MEM_LIMIT=${{ vars.DUAL_REDIS_MEM_LIMIT || '4g' }}
          REDIS_CPU_LIMIT=${{ vars.DUAL_REDIS_CPU_LIMIT || '2.00' }}
          REDIS_MAXMEMORY=${{ vars.DUAL_REDIS_MAXMEMORY || '3gb' }}
          ADMIN_MEM_LIMIT=${{ vars.DUAL_ADMIN_MEM_LIMIT || '2g' }}
          ADMIN_CPU_LIMIT=${{ vars.DUAL_ADMIN_CPU_LIMIT || '1.50' }}"

          # .env.251 — app server: DB/Redis on 252, agent pool local
          {
            echo "$ENV_CONTENT"
            echo "$NON_SECRET"
            echo "DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.DEPLOY_HOST_252 }}:5432/cuneim"
            echo "REDIS_URL=redis://${{ secrets.DEPLOY_HOST_252 }}:6379"
            echo "AGENT_POOL_URL=http://agent:3000"
          } > .env.251

          # .env.252 — data server: DB/Redis local, agent pool on 251
          {
            echo "$ENV_CONTENT"
            echo "$NON_SECRET"
            echo "DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/cuneim"
            echo "REDIS_URL=redis://redis:6379"
            echo "AGENT_POOL_URL=http://${{ secrets.DEPLOY_HOST_251 }}:3100"
          } > .env.252

      # Dual Step 1: SCP to 252 (data server)
      - name: Copy compose file to 252
        if: env.BUILD_APP == 'true' || env.BUILD_ADMIN == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_252 }}
          username: ${{ secrets.DEPLOY_USER_252 }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.252.yml"
          target: "~/cuneim/"

      - name: Copy .env.252 to 252
        if: env.BUILD_APP == 'true' || env.BUILD_ADMIN == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_252 }}
          username: ${{ secrets.DEPLOY_USER_252 }}
          key: ${{ secrets.SSH_KEY }}
          source: ".env.252"
          target: "~/cuneim/"

      # Dual Step 2: SSH deploy to 252 (data server — postgres, redis, admin, app)
      - name: Deploy to 252 (data server)
        if: env.BUILD_APP == 'true' || env.BUILD_ADMIN == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_IMAGE: ${{ env.IMAGE_NAME }}
          GHCR_IMAGE_AGENT: ${{ env.AGENT_IMAGE_NAME }}
          GHCR_IMAGE_ADMIN: ${{ env.ADMIN_IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          BUILD_APP: ${{ env.BUILD_APP }}
          BUILD_AGENT: ${{ env.BUILD_AGENT }}
          BUILD_ADMIN: ${{ env.BUILD_ADMIN }}
          RUN_ADMIN_MIGRATIONS: ${{ vars.DUAL_RUN_ADMIN_MIGRATIONS || 'false' }}
        with:
          host: ${{ secrets.DEPLOY_HOST_252 }}
          username: ${{ secrets.DEPLOY_USER_252 }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_PAT,GHCR_USERNAME,GHCR_IMAGE,GHCR_IMAGE_AGENT,GHCR_IMAGE_ADMIN,IMAGE_TAG,BUILD_APP,BUILD_AGENT,BUILD_ADMIN,RUN_ADMIN_MIGRATIONS
          script: |
            set -e

            # Create deployment directories
            mkdir -p ~/cuneim
            mkdir -p ~/cuneim/agent/data ~/cuneim/shared-logs

            # Preserve tags for services that were not selected in this deployment.
            OLD_APP_TAG=$(grep '^APP_IMAGE_TAG=' ~/cuneim/.env 2>/dev/null | cut -d= -f2 || true)
            OLD_AGENT_TAG=$(grep '^AGENT_IMAGE_TAG=' ~/cuneim/.env 2>/dev/null | cut -d= -f2 || true)
            OLD_ADMIN_TAG=$(grep '^ADMIN_IMAGE_TAG=' ~/cuneim/.env 2>/dev/null | cut -d= -f2 || true)
            : "${OLD_APP_TAG:=latest}"
            : "${OLD_AGENT_TAG:=latest}"
            : "${OLD_ADMIN_TAG:=latest}"

            # Activate machine-specific files
            cp ~/cuneim/docker-compose.252.yml ~/cuneim/docker-compose.yml
            mv ~/cuneim/.env.252 ~/cuneim/.env

            if [ "$BUILD_APP" = "true" ]; then echo "APP_IMAGE_TAG=$IMAGE_TAG" >> ~/cuneim/.env; else echo "APP_IMAGE_TAG=$OLD_APP_TAG" >> ~/cuneim/.env; fi
            if [ "$BUILD_AGENT" = "true" ]; then echo "AGENT_IMAGE_TAG=$IMAGE_TAG" >> ~/cuneim/.env; else echo "AGENT_IMAGE_TAG=$OLD_AGENT_TAG" >> ~/cuneim/.env; fi
            if [ "$BUILD_ADMIN" = "true" ]; then echo "ADMIN_IMAGE_TAG=$IMAGE_TAG" >> ~/cuneim/.env; else echo "ADMIN_IMAGE_TAG=$OLD_ADMIN_TAG" >> ~/cuneim/.env; fi

            cd ~/cuneim

            # Login to GHCR to pull private images
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            # Start data layer first
            docker compose pull postgres redis
            docker compose up -d postgres redis

            # Wait for postgres to be healthy
            echo "Waiting for postgres to be healthy..."
            POSTGRES_READY=false
            for i in $(seq 1 30); do
              if docker compose exec -T postgres pg_isready -U postgres 2>/dev/null; then
                echo "Postgres is ready"
                POSTGRES_READY=true
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            if [ "$POSTGRES_READY" != "true" ]; then
              echo "Postgres did not become ready within 60 seconds" >&2
              docker compose logs --tail=100 postgres >&2
              exit 1
            fi

            # Migrate before replacing running application containers. Migration
            # failures are deployment failures; never publish a false success.
            if [ "$BUILD_APP" = "true" ]; then
              docker compose pull app-0
              docker compose run --rm --no-deps --user root app-0 npx prisma migrate deploy
            fi
            if [ "$BUILD_ADMIN" = "true" ]; then
              docker compose pull admin
              if [ "$RUN_ADMIN_MIGRATIONS" = "true" ]; then
                docker compose run --rm --no-deps admin npx prisma migrate deploy
                if [ ! -f ~/cuneim/.admin_seed_done_v2 ]; then
                  docker compose run --rm --no-deps admin node prisma/seed.js
                  touch ~/cuneim/.admin_seed_done_v2
                fi
              else
                echo "Admin migration skipped: set DUAL_RUN_ADMIN_MIGRATIONS=true after migration histories are consolidated"
              fi
            fi

            if [ "$BUILD_APP" = "true" ]; then
              docker compose up -d --remove-orphans app-0 app-1
              for port in 3000 3001; do
                for i in $(seq 1 30); do
                  if curl -fsS "http://localhost:${port}/api/health" >/dev/null; then break; fi
                if [ "$i" = "30" ]; then
                  echo "App on port ${port} failed its health check" >&2
                  docker compose ps >&2
                  docker compose logs --tail=100 app-0 app-1 >&2
                  exit 1
                fi
                  sleep 2
                done
              done
            fi
            if [ "$BUILD_ADMIN" = "true" ]; then
              docker compose up -d admin
              for i in $(seq 1 30); do
                if curl -fsS http://localhost:3006/api >/dev/null; then break; fi
                if [ "$i" = "30" ]; then
                  echo "Admin failed its health check" >&2
                  docker compose ps admin >&2
                  docker compose logs --tail=200 admin >&2
                  exit 1
                fi
                sleep 2
              done
            fi

      # Dual Step 3: SCP to 251 (app server)
      - name: Copy compose file to 251
        if: env.BUILD_APP == 'true' || env.BUILD_AGENT == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_251 }}
          username: ${{ secrets.DEPLOY_USER_251 }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.251.yml"
          target: "~/cuneim/"

      - name: Copy nginx files to 251
        if: env.BUILD_APP == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_251 }}
          username: ${{ secrets.DEPLOY_USER_251 }}
          key: ${{ secrets.SSH_KEY }}
          source: "nginx/"
          target: "~/cuneim/"

      - name: Copy .env.251 to 251
        if: env.BUILD_APP == 'true' || env.BUILD_AGENT == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST_251 }}
          username: ${{ secrets.DEPLOY_USER_251 }}
          key: ${{ secrets.SSH_KEY }}
          source: ".env.251"
          target: "~/cuneim/"

      # Dual Step 4: SSH deploy to 251 (app server — agent, app, nginx)
      - name: Deploy to 251 (app server)
        if: env.BUILD_APP == 'true' || env.BUILD_AGENT == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_IMAGE: ${{ env.IMAGE_NAME }}
          GHCR_IMAGE_AGENT: ${{ env.AGENT_IMAGE_NAME }}
          GHCR_IMAGE_ADMIN: ${{ env.ADMIN_IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          BUILD_APP: ${{ env.BUILD_APP }}
          BUILD_AGENT: ${{ env.BUILD_AGENT }}
          BUILD_ADMIN: ${{ env.BUILD_ADMIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST_251 }}
          username: ${{ secrets.DEPLOY_USER_251 }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_PAT,GHCR_USERNAME,GHCR_IMAGE,GHCR_IMAGE_AGENT,GHCR_IMAGE_ADMIN,IMAGE_TAG,BUILD_APP,BUILD_AGENT,BUILD_ADMIN
          script: |
            set -e

            # Create deployment directories
            mkdir -p ~/cuneim
            mkdir -p ~/cuneim/agent/data ~/cuneim/shared-logs

            # Preserve tags for services that were not selected in this deployment.
            OLD_APP_TAG=$(grep '^APP_IMAGE_TAG=' ~/cuneim/.env 2>/dev/null | cut -d= -f2 || true)
            OLD_AGENT_TAG=$(grep '^AGENT_IMAGE_TAG=' ~/cuneim/.env 2>/dev/null | cut -d= -f2 || true)
            OLD_ADMIN_TAG=$(grep '^ADMIN_IMAGE_TAG=' ~/cuneim/.env 2>/dev/null | cut -d= -f2 || true)
            : "${OLD_APP_TAG:=latest}"
            : "${OLD_AGENT_TAG:=latest}"
            : "${OLD_ADMIN_TAG:=latest}"

            # Activate machine-specific files
            cp ~/cuneim/docker-compose.251.yml ~/cuneim/docker-compose.yml
            mv ~/cuneim/.env.251 ~/cuneim/.env

            if [ "$BUILD_APP" = "true" ]; then echo "APP_IMAGE_TAG=$IMAGE_TAG" >> ~/cuneim/.env; else echo "APP_IMAGE_TAG=$OLD_APP_TAG" >> ~/cuneim/.env; fi
            if [ "$BUILD_AGENT" = "true" ]; then echo "AGENT_IMAGE_TAG=$IMAGE_TAG" >> ~/cuneim/.env; else echo "AGENT_IMAGE_TAG=$OLD_AGENT_TAG" >> ~/cuneim/.env; fi
            if [ "$BUILD_ADMIN" = "true" ]; then echo "ADMIN_IMAGE_TAG=$IMAGE_TAG" >> ~/cuneim/.env; else echo "ADMIN_IMAGE_TAG=$OLD_ADMIN_TAG" >> ~/cuneim/.env; fi

            cd ~/cuneim

            # Login to GHCR to pull private images
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            if [ "$BUILD_AGENT" = "true" ]; then
              docker compose pull agent
              docker compose up -d agent
              for i in $(seq 1 30); do
                if curl -fsS http://localhost:3100/health >/dev/null; then break; fi
                if [ "$i" = "30" ]; then
                  echo "Agent failed its health check" >&2
                  docker compose ps agent >&2
                  docker compose logs --tail=200 agent >&2
                  exit 1
                fi
                sleep 2
              done
            fi
            if [ "$BUILD_APP" = "true" ]; then
              docker compose pull app-0
              docker compose up -d --remove-orphans app-0 app-1 app-2 app-3 app-4 app-5 app-6 app-7
              for port in 3000 3001 3002 3003 3004 3005 3006 3007; do
                for i in $(seq 1 30); do
                  if curl -fsS "http://localhost:${port}/api/health" >/dev/null; then break; fi
                  if [ "$i" = "30" ]; then
                    echo "App on port ${port} failed its health check" >&2
                    docker compose ps >&2
                    docker compose logs --tail=100 app-0 app-1 app-2 app-3 app-4 app-5 app-6 app-7 >&2
                    exit 1
                  fi
                  sleep 2
                done
              done
            fi

            if [ "$BUILD_APP" = "true" ]; then
              # Validate and atomically recreate the containerized nginx. The
              # host nginx service is intentionally not part of this architecture.
              sed -i 's/\${APP_252_HOST}/'"${{ secrets.DEPLOY_HOST_252 }}"'/g' ~/cuneim/nginx/*.conf
              docker compose pull nginx
              docker compose run --rm --no-deps nginx nginx -t
              docker compose up -d --force-recreate nginx
            fi

  notify:
    if: always()
    runs-on: ubuntu-latest
    needs: [parse, build, deploy]
    steps:
      - name: Checkout proxy repo
        uses: actions/checkout@v4

      - name: 🔔 推送到 Lark
        env:
          STATUS: ${{ needs.deploy.result }}
          SERVICES: ${{ needs.parse.outputs.services_display }}
          ACTOR: ${{ github.actor }}
          DEPLOY_TAG: ${{ needs.parse.outputs.deploy_tag }}
          DEPLOY_TARGET: dual
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          COMMIT_MESSAGE: ${{ needs.build.outputs.commit_message }}
          COMMIT_TIME: ${{ needs.build.outputs.commit_time }}
          REPOSITORY: ${{ secrets.REPOSITORY }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: bash ${GITHUB_WORKSPACE}/.github/scripts/notify-worker.sh
