services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    mem_limit: 50g
    command:
      - postgres
      - -c
      - shared_buffers=16GB
      - -c
      - effective_cache_size=48GB
      - -c
      - random_page_cost=1.1
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=64MB
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 6g
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - app_network

  admin:
    image: ghcr.io/moocherci/admin:${ADMIN_IMAGE_TAG:-latest}
    ports:
      - "3006:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  app-0:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  app-1:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3001:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  app-2:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3002:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  app-3:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3003:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  app-4:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3004:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  app-5:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3005:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

volumes:
  shared-logs:
  pgdata:
  redis_data:

networks:
  app_network:
    driver: bridge
