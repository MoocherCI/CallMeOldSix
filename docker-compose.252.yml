services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=cuneim
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-10GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-30GB}
      - -c
      - random_page_cost=1.1
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-2GB}
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=64MB
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-40g}
    cpus: ${POSTGRES_CPU_LIMIT:-8.00}
    networks:
      - app_network

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-3gb} --maxmemory-policy allkeys-lru
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-4g}
    cpus: ${REDIS_CPU_LIMIT:-2.00}
    networks:
      - app_network

  admin:
    image: ghcr.io/moocherci/admin:${ADMIN_IMAGE_TAG:-latest}
    ports:
      - "3006:3001"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: ${ADMIN_MEM_LIMIT:-2g}
    cpus: ${ADMIN_CPU_LIMIT:-1.50}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app_network

  app-0:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-2g}
    cpus: ${APP_CPU_LIMIT:-1.50}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app_network

  app-1:
    image: ghcr.io/moocherci/user-platform:${APP_IMAGE_TAG:-latest}
    ports:
      - "3001:3000"
    volumes:
      - shared-logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-2g}
    cpus: ${APP_CPU_LIMIT:-1.50}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app_network

volumes:
  shared-logs:
  pgdata:
  redis_data:

networks:
  app_network:
    driver: bridge
